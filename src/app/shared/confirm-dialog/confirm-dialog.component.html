<div class="dialog-header">
  <div class="dialog-header-icon" [class.warn]="warn" aria-hidden="true">
    <mat-icon>{{ warn ? 'warning_amber' : 'help_outline' }}</mat-icon>
  </div>
  <div class="dialog-header-text">
    <h2 class="dialog-title">{{ title }}</h2>
    <p class="dialog-message">{{ message }}</p>
  </div>
</div>
<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button type="button" (click)="cancel()" class="btn-cancel">
    {{ cancelText }}
  </button>
  <button
    mat-raised-button
    [color]="warn ? 'warn' : 'primary'"
    type="button"
    (click)="confirm()"
    class="btn-confirm"
    [class.btn-confirm-warn]="warn"
  >
    {{ confirmText }}
  </button>
</mat-dialog-actions>
